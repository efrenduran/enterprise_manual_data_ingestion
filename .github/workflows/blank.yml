name: Validate Data Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar DAG
        run: |
          python -m py_compile manual_ingestion/DAG/alpha_study_monthly_weekly_ingestion.py
          python -m py_compile manual_ingestion/DAG/task_config.py

      - name: Verificar tabelas SQL
        run: |
          test -f manual_ingestion/tables/weekly/raw_alpha_study_weekly.sql
          test -f manual_ingestion/tables/weekly/hist_alpha_study_weekly.sql
          test -f manual_ingestion/tables/weekly/dq_project_alpha_weekly.sql

      - name: Validar YAML
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('manual_ingestion/tables/weekly/dq_project_alpha_weekly.yml')); print('YAML OK')"
