name: Validate Data Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate DAG Python Files
        run: |
          python -m py_compile manual_ingestion/DAG/*.py

      - name: Verify SQL Files Exist
        run: |
          test -f manual_ingestion/tables/weekly/raw_alpha_study_weekly.sql
          test -f manual_ingestion/tables/weekly/hist_alpha_study_weekly.sql
          test -f manual_ingestion/tables/weekly/dq_project_alpha_weekly.sql

      - name: Validate YAML Configuration
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('manual_ingestion/tables/weekly/dq_project_alpha_weekly.yml')); print('YAML validation passed')"
